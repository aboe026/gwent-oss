#user  nobody;
worker_processes    1;
events {
    worker_connections    1024;
}
http {
    include                 mime.types;
    default_type            application/octet-stream;
    send_timeout            1800;
    sendfile                on;
    keepalive_timeout       6500;
    client_max_body_size    10M; # allows file uploads up to 10 megabytes

    resolver    127.0.0.11    valid=10s; # 127.0.0.1 comes from /etc/resolv.conf on the nginx container

    upstream ui {
        server    ui:3000;  # ui corresponds to the service name for the gwent-oss container in docker-compose.yml
    }

    upstream api {
        server    api:4000;  # api corresponds to the service name for the gwent-oss container in docker-compose.yml
    }


    server {
        listen    443 ssl;

        ssl_certificate        /etc/ssl/certs/server.crt;
        ssl_certificate_key    /etc/ssl/private/server.key;
        ssl_session_timeout    5m;

        ssl_protocols                SSLv2 SSLv3 TLSv1.2;
        ssl_ciphers                  ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
        ssl_prefer_server_ciphers    on;

        # requried for session cookies (secure) to be applied correctly
        proxy_set_header         Host                 $host;
        proxy_set_header         X-Real-IP            $remote_addr;
        proxy_set_header         X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header         X-Real-Addr          $realip_remote_addr;
        proxy_set_header         X-Client-Verify      SUCCESS;
        proxy_set_header         X-Client-DN          $ssl_client_s_dn;
        proxy_set_header         X-SSL-Subject        $ssl_client_s_dn;
        proxy_set_header         X-SSL-Issuer         $ssl_client_i_dn;
        proxy_set_header         X-Forwarded-Proto    $scheme;
        proxy_set_header         X-NginX-Proxy        true;
        proxy_read_timeout       5m;
        proxy_connect_timeout    5m;

        location /graphql {
            proxy_pass        http://api/graphql;
            proxy_redirect    off;
        }

        location /subscribe {
            proxy_pass            http://api/subscribe;
            proxy_redirect        off;
            proxy_http_version    1.1;
            proxy_set_header      Upgrade            $http_upgrade;
            proxy_set_header      Connection         "upgrade";
            proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_read_timeout    1d;
        }

        location / {
            proxy_pass        http://ui;
            proxy_redirect    off;
        }
    }
}