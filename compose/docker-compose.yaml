services:
  database:
    image: mongo:8.3.7
    restart: ${RESTART_POLICY}
    networks:
      - gwent-oss
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_pass
    secrets:
      - mongo_user
      - mongo_pass
    volumes:
      - mongo_data:/data/db

  api:
    image: gwent-oss-api:${GWENT_OSS_TAG}
    restart: ${RESTART_POLICY}
    networks:
      - gwent-oss
    build:
      context: ../
      dockerfile: msvs/api/Dockerfile
    depends_on:
      - database
    environment:
      MONGO_USERNAME_FILE: /run/secrets/mongo_user
      MONGO_PASSWORD_FILE: /run/secrets/mongo_pass
      LOG_LEVEL: ${LOG_LEVEL}
      MONGO_URL: mongodb://database:27017
      CORS_ORIGIN: https://${HOST_NAME}
    secrets:
      - mongo_user
      - mongo_pass

  ui:
    image: gwent-oss-ui:${GWENT_OSS_TAG}
    restart: ${RESTART_POLICY}
    networks:
      - gwent-oss
    build:
      context: ../
      dockerfile: msvs/ui/Dockerfile
    depends_on:
      - api
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - API_BASE_URL=https://${HOST_NAME}

  router:
    image: caddy:2.11.4
    restart: ${RESTART_POLICY}
    networks:
      - gwent-oss
    depends_on:
      - api
      - ui
    environment:
      - HOST_NAME=${HOST_NAME}
      - LOCAL_CERTS=${LOCAL_CERTS}
      - DEBUG=${DEBUG}
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

secrets:
  mongo_user:
    file: ./secrets/mongo_user
  mongo_pass:
    file: ./secrets/mongo_pass

networks:
  gwent-oss:
    name: ${NETWORK_NAME}
    driver: bridge
