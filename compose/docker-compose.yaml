services:
  database:
    image: mongo:8.3.7
    restart: ${RESTART_POLICY}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db

  api:
    image: gwent-oss-api:${GWENT_OSS_TAG:-latest}
    restart: ${RESTART_POLICY}
    build:
      context: ../
      dockerfile: msvs/api/Dockerfile
    depends_on:
      - database
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - MONGO_URL=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@database:27017
      - CORS_ORIGIN=https://${HOST_NAME}

  ui:
    image: gwent-oss-ui:${GWENT_OSS_TAG:-latest}
    restart: ${RESTART_POLICY}
    build:
      context: ../
      dockerfile: msvs/ui/Dockerfile
    depends_on:
      - api
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - API_BASE_URL=https://${HOST_NAME}

  router:
    image: caddy:2.11.4
    restart: ${RESTART_POLICY}
    depends_on:
      - api
      - ui
    environment:
      - HOST_NAME=${HOST_NAME}
      - LOCAL_CERTS=${LOCAL_CERTS}
      - DEBUG=${DEBUG}
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
