fragment PlayerRound on PlayerRound {
  close {
    ...PlayerCombatRowFragment
  }
  moves {
    ... on MoveLeader {
      created
      leader {
        image
        name
      }
    }
    ... on MovePass {
      created
    }
    ... on MoveUnit {
      created
      unit {
        ...GameUnitFragment
      }
      impacts {
        unit {
          ...GameUnitFragment
        }
        user {
          id
          name
        }
        source {
          origin
        }
      }
      reason {
        type
        unit {
          unit {
            name
          }
        }
      }
      source {
        origin
      }
    }
  }
  passed
  ranged {
    ...PlayerCombatRowFragment
  }
  result
  score
  siege {
    ...PlayerCombatRowFragment
  }
}
