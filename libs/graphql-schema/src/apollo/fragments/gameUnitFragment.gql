fragment GameUnitFragment on GameUnit {
  artStyle
  effectiveStrength
  effects {
    operator
    total
    reason {
      ... on EffectFromUnit {
        effect {
          id
          name
        }
        unit {
          id
          name
        }
      }
      ... on EffectFromLeader {
        leader {
          id
          name
        }
      }
    }
  }
  row
  unit {
    ...CardUnitFragment
  }
}
