fragment GamePlayerFragment on GamePlayer {
  counts {
    discard
    hand
    undrawn
  }
  faction {
    ...GameFactionFragment
  }
  leader {
    ...GameLeaderFragment
  }
  ready
  rounds {
    close {
      ...PlayerCombatRowFragment
    }
    moves {
      ... on MoveLeader {
        created
        leader {
          image
          name
        }
      }
      ... on MovePass {
        created
      }
      ... on MoveUnit {
        created
        unit {
          ...GameUnitFragment
        }
        impacts {
          unit {
            ...GameUnitFragment
          }
          user {
            id
            name
          }
        }
        reason {
          type
          unit {
            unit {
              name
            }
          }
        }
      }
    }
    passed
    ranged {
      ...PlayerCombatRowFragment
    }
    result
    score
    siege {
      ...PlayerCombatRowFragment
    }
  }
  user {
    id
    name
  }
}
