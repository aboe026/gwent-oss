fragment GamePlayerFragment on GamePlayer {
  counts {
    discard
    hand
    undrawn
  }
  faction {
    ...GameFactionFragment
  }
  leader {
    ...GameLeaderFragment
  }
  ready
  rounds {
    close {
      ...PlayerCombatRowFragment
    }
    moves {
      ... on MoveLeader {
        created
        leader {
          image
          name
        }
      }
      ... on MovePass {
        created
      }
      ... on MoveUnit {
        created
        row
        unit {
          artStyle
          unit {
            effects {
              image
              key
              name
            }
            id
            images
            name
          }
        }
        impacts {
          unit {
            artStyle
            unit {
              name
              id
              images
            }
            effectiveStrength
          }
          user {
            id
            name
          }
        }
      }
    }
    passed
    ranged {
      ...PlayerCombatRowFragment
    }
    result
    score
    siege {
      ...PlayerCombatRowFragment
    }
  }
  user {
    id
    name
  }
}
