fragment GamePlayerFragment on GamePlayer {
  counts {
    discard
    hand
    undrawn
  }
  faction {
    ...GameFactionFragment
  }
  leader {
    ...GameLeaderFragment
  }
  ready
  rounds {
    score
    close {
      ...PlayerCombatRowFragment
    }
    ranged {
      ...PlayerCombatRowFragment
    }
    siege {
      ...PlayerCombatRowFragment
    }
  }
  user {
    id
    name
  }
}
