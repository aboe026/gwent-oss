directive @union(discriminatorField: String, additionalFields: [AdditionalEntityFields]) on UNION

directive @abstractEntity(discriminatorField: String!, additionalFields: [AdditionalEntityFields]) on INTERFACE

directive @entity(embedded: Boolean, additionalFields: [AdditionalEntityFields]) on OBJECT

directive @column(overrideType: String) on FIELD_DEFINITION

directive @id on FIELD_DEFINITION

directive @link(overrideType: String) on FIELD_DEFINITION

directive @embedded on FIELD_DEFINITION

directive @map(path: String!) on FIELD_DEFINITION

input AdditionalEntityFields {
  path: String
  type: String
}
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Application {
  "The current build number of the application running."
  build: Int!
  "The current version of the application running."
  version: SemVer!
}

enum Combat {
  "Close"
  CLOSE
  "Ranged"
  RANGED
  "Siege"
  SIEGE
}

scalar DateTime

type Deck @entity {
  created: DateTime! @column
  faction: Faction! @column(overrideType: "ObjectId")
  id: ID! @id @map(path: "_id")
  leader: Leader! @column(overrideType: "ObjectId")
  name: String! @column
  stats: UnitStats! @column
  units: [DeckUnit!]! @column(overrideType: "Array<DeckUnitDbObject>")
  user: User! @column(overrideType: "ObjectId")
}

type DeckUnit @entity {
  artStyle: Int! @column
  unit: Unit! @column(overrideType: "ObjectId")
}

input DeckUnitInput {
  "For units with multiple art styles, the art style to use (1-based indexing)."
  artStyle: Int = 1
  id: ID!
}

type Dlc @entity {
  created: DateTime! @column
  id: ID! @id @map(path: "_id")
  image: String! @column
  key: DlcKey! @column
  name: String! @column
}

enum DlcKey {
  "Blood and Wine"
  BLOOD_AND_WINE
  "Gwent: The Witcher Card Game"
  GWENT_THE_WITCHER_CARD_GAME
  "Hearts of Stone"
  HEARTS_OF_STONE
}

type Effect @entity {
  ability: String! @column
  created: DateTime! @column
  id: ID! @id @map(path: "_id")
  image: String! @column
  key: EffectKey! @column
  name: String! @column
}

type EffectFromLeader @entity(additionalFields: [{path: "type", type: "EffectReasonType"}]) {
  leader: Leader! @column(overrideType: "ObjectId")
}

type EffectFromUnit @entity(additionalFields: [{path: "type", type: "EffectReasonType"}]) {
  effect: Effect! @column(overrideType: "ObjectId")
  unit: Unit! @column(overrideType: "ObjectId")
}

enum EffectKey {
  "Agile"
  AGILE
  "Summon Avenger"
  AVENGER
  "Berserker"
  BERSERKER
  "Tight Bond"
  BOND
  "Decoy"
  DECOY
  "Commander's Horn"
  HORN
  "Mardroeme"
  MARDROEME
  "Medic"
  MEDIC
  "Morale Boost"
  MORALE
  "Muster"
  MUSTER
  "Scorch"
  SCORCH
  "Spy"
  SPY
  "Weather"
  WEATHER
}

union EffectReason @union(discriminatorField: "type") = EffectFromLeader | EffectFromUnit

type Faction @entity {
  ability: String @column
  created: DateTime! @column
  dlc: Dlc @column(overrideType: "ObjectId")
  id: ID! @id @map(path: "_id")
  image: String! @column
  key: FactionKey! @column
  name: String! @column
  stats: UnitStats! @column
}

enum FactionKey {
  "Monsters"
  MONSTERS
  "Neutral"
  NEUTRAL
  "Nilfgaardian Empire"
  NILFGAARDIAN_EMPIRE
  "Northern Realms"
  NORTHERN_REALMS
  "Scoia'tael"
  SCOIA_TAEL
  "Skellige"
  SKELLIGE
}

type Game @entity {
  config: GameConfig! @column
  created: DateTime! @column
  creator: User! @column(overrideType: "ObjectId")
  id: ID! @id @map(path: "_id")
  players: [GamePlayer!]! @column(overrideType: "Array<GamePlayerDbObject>")
  "The current round the game is in. 1-based indexing. A value of zero indicates the game has not yet started."
  round: Int! @column
  status: GameStatus! @column
  "Whose turn it currently is to make a move."
  turn: GamePlayer @column(overrideType: "ObjectId")
  updated: DateTime! @column
  victors: [User!]! @column(overrideType: "Array<ObjectId>")
  weather: [Combat!]! @column
}

type GameConfig {
  "The number of lives each player starts with at the beginning of the game."
  lives: Int! @column
}

type GameDeck @entity {
  "The units which have been sent to the graveyard"
  discard: [DeckUnit!]! @column(overrideType: "Array<DeckUnitDbObject>")
  "A snapshot of the user deck when it was selected for the game"
  from: Deck @column(overrideType: "DeckDbObject")
  "The currently playable units"
  hand: [DeckUnit!]! @column(overrideType: "Array<DeckUnitDbObject>")
  "Units which the player has chosen to redraw to be replaced by a different random undrawn unit."
  redraws: [Redraw!]! @column(overrideType: "Array<RedrawDbObject>")
  "The units which have not yet been drawn"
  undrawn: [DeckUnit!]! @column(overrideType: "Array<DeckUnitDbObject>")
}

type GameDeckSet {
  deck: GameDeck!
  game: Game!
}

enum GameDeckStatus {
  "Player is choosing their deck to use for the game."
  CHOOSING
  "Player is optionally selecting units to redraw from their selected deck."
  REDRAWING
  "Player game deck is finalized and ready to play."
  SET
}

type GamePlayer @entity(additionalFields: [{path: "deck", type: "GameDeckDbObject"}]) {
  "The number of cards in the game deck of the player. Only visible once all players are ready."
  counts: GamePlayerUnitCounts
  "The faction the player chose for the game. Only visible once all players are ready."
  faction: Faction
  "The leader the player chose for the game. Only visible once all players are ready."
  leader: Leader
  "The precedence of order the player takes their turn relative to other players. Zero based indexing."
  order: Int @column
  "Whether or not a user has their game deck set to play the game."
  ready: Boolean! @column
  rounds: [PlayerRound!]! @column(overrideType: "Array<PlayerRoundDbObject>")
  user: User! @column(overrideType: "ObjectId")
}

type GamePlayerUnitCounts {
  discard: Int!
  hand: Int!
  undrawn: Int!
}

enum GameStatus {
  "Players are choosing their decks to use for the game."
  DECKING
  "Play has ended."
  DONE
  "The order of player turns is being decided. Happens automatically unless there is a single player with a Scoia'tael faction deck who can then choose which player starts."
  ORDERING
  "Players are playing rounds of the game."
  PLAYING
  "Players are potentially redrawing the cards in their hand."
  REDRAWING
}

type GameUnit @entity {
  artStyle: Int! @column
  effectiveStrength: Int @column
  effects: [GameUnitEffect!] @column(overrideType: "Array<GameUnitEffectDbObject>")
  row: Combat @column
  unit: Unit! @column(overrideType: "ObjectId")
}

type GameUnitEffect @entity {
  operator: String! @column
  reason: EffectReason! @column(overrideType: "EffectReasonDbObject")
  total: Int! @column
}

enum GameUnitOrigin {
  "Unit came from the users Lost pile."
  Discard
  "Unit came from the users Hand."
  HAND
  "Unit came from an opponent placing it on their battlefield."
  OPPONENT
  "Unit came from the users Draw pile."
  UNDRAWN
}

type GameUnitRedrawn {
  deck: GameDeck!
  from: DeckUnit!
  game: Game!
  to: DeckUnit!
}

type GameUnitSource @entity {
  origin: GameUnitOrigin! @column
  user: User @column(overrideType: "ObjectId")
}

"A unit which was impacted by another unit."
type Impact @entity {
  source: GameUnitSource @column(overrideType: "GameUnitSourceDbObject")
  unit: GameUnit! @column(overrideType: "GameUnitDbObject")
  user: User! @column(overrideType: "ObjectId")
}

type Leader @entity {
  ability: String! @column
  created: DateTime! @column
  dlc: Dlc @column(overrideType: "ObjectId")
  faction: Faction! @column(overrideType: "ObjectId")
  id: ID! @id @map(path: "_id")
  image: String! @column
  name: String! @column
  quote: String! @column
}

union Move @union(discriminatorField: "type") = MoveLeader | MovePass | MoveUnit

type MoveLeader @entity(additionalFields: [{path: "type", type: "MoveType"}]) {
  created: DateTime! @column
  leader: Leader! @column(overrideType: "ObjectId")
}

type MovePass @entity(additionalFields: [{path: "type", type: "MoveType"}]) {
  created: DateTime! @column
}

enum MoveReasonType {
  "Deployment by a game player to the battlefield."
  DEPLOY
  "Mustered when matching Muster unit added to battlefield."
  MUSTER
  "Revived by Medic added to battlefield."
  REVIVE
  "Summoned when matching Avenger unit removed from battlefield."
  SUMMON
  "Transformed when Mardroeme unit added to battlefield row."
  TRANSFORM
}

type MoveUnit @entity(additionalFields: [{path: "type", type: "MoveType"}]) {
  created: DateTime! @column
  impacts: [Impact!] @column(overrideType: "Array<ImpactDbObject>")
  reason: MoveUnitReason! @column(overrideType: "MoveUnitReasonDbObject")
  source: GameUnitSource! @column(overrideType: "GameUnitSourceDbObject")
  unit: GameUnit! @column(overrideType: "GameUnitDbObject")
}

type MoveUnitReason @entity {
  type: MoveReasonType! @column
  unit: DeckUnit @column(overrideType: "DeckUnitDbObject")
}

type Mutation {
  "Create a user-defined deck."
  addDeck(faction: FactionKey!, leader: ID!, name: String!, units: [DeckUnitInput!]!): Deck!
  "Create a game of Gwent between the authenticated user and another player."
  addGame(opponentNames: [String!]!): Game!
  "Create a user."
  addUser(name: String!, password: String!): User!
  "Authenticate a user."
  login(name: String!, password: String!): User!
  "De-authenticate a user."
  logout: Boolean!
  "Pass for the rest of the round in a game."
  playPass(game: ID!): Game!
  "Play a Unit card in a game. If a unit is eligible for multiple different types of Combat, one must be specified."
  playUnit(combat: Combat, game: ID!, unit: ID!): Game!
  "Mark player as ready to play the game, no more deck modifications allowed."
  ready(game: ID!): Game!
  "Replace a card in hand with a random one from the deck, before a game starts."
  redraw(game: ID!, unit: ID!): DeckUnit!
  "Choose which deck will be used for the game."
  setDeck(deck: ID!, game: ID!): GameDeck!
  "Set the order in which players will take turns during a game."
  setOrder(game: ID!, users: [ID!]): Game!
}

type PlayerCombatRow @entity {
  score: Int! @column
  units: [GameUnit!]! @column(overrideType: "Array<GameUnitDbObject>")
}

type PlayerRound @entity {
  close: PlayerCombatRow! @column(overrideType: "PlayerCombatRowDbObject")
  moves: [Move!]! @column(overrideType: "Array<MoveDbObject>")
  passed: Boolean! @column
  ranged: PlayerCombatRow! @column(overrideType: "PlayerCombatRowDbObject")
  result: RoundResult @column
  score: Int! @column
  siege: PlayerCombatRow! @column(overrideType: "PlayerCombatRowDbObject")
}

type Query {
  "Information about the application running."
  application: Application!
  "The current user on the session if they are authenticated."
  currentUser: User
  "All decks created by the authenticated user."
  decks: [Deck!]!
  "All factions which a leader, unit or deck can belong to."
  factions(keys: [FactionKey!]): [Faction!]!
  "A game by its ID."
  game(id: ID!): Game!
  "The deck selected to be played for the given game."
  gameDeck(game: ID!): GameDeck
  "All games which a user created or is part of."
  games: [Game!]!
  "All leaders available to build decks with."
  leaders(factions: [FactionKey!]): [Leader!]!
  "The settings configured for the application."
  settings: [Setting!]!
  "All units available to build decks with."
  units(deckable: Boolean, factions: [FactionKey!]): [Unit!]!
}

type Redraw @entity {
  from: DeckUnit! @column(overrideType: "DeckUnitDbObject")
  to: DeckUnit! @column(overrideType: "DeckUnitDbObject")
}

type RoundEndedForDeck {
  deck: GameDeck!
  game: Game!
}

enum RoundResult {
  "Tied for the win with another player in the round."
  DREW
  "Beaten by another player in the round."
  LOST
  "Beat all other players in the round."
  WON
}

scalar SemVer

type Setting {
  key: SettingKey!
  label: String!
  type: SettingType!
  value: String!
}

enum SettingKey {
  SESSION_TIMEOUT_SECONDS
}

enum SettingType {
  NUMBER
}

type Subscription {
  "A deck has been added for a user."
  deckAdded: Deck!
  "A deck has been set for a game the user is a player on."
  deckSet: GameDeckSet!
  "A game has been added that the user is player on."
  gameAdded: Game!
  "A game the user is a player on has been marked as ready by a player."
  gameReady: Game!
  "All decks have been set for a game the user is a player on."
  gameSet: Game!
  "The order has been set for a game the user is a player on."
  orderSet: Game!
  "A user has passed the rest of the round for a game."
  passPlayed: Game!
  "A round has finished which triggers updates to the GameDeck for each player on the game."
  roundEndedForDeck: RoundEndedForDeck!
  "The unit card played from a deck and the updated GameDeck."
  unitPlayedFromDeck: UnitPlayedFromDeck!
  "The unit card played on a game and the updated Game."
  unitPlayedOnGame: UnitPlayedOnGame!
  "A unit was redrawn for a game deck the user owns."
  unitRedrawn: GameUnitRedrawn!
}

type Unit @entity {
  combats: [Combat!] @column
  created: DateTime! @column
  deckable: Boolean! @column
  dlc: Dlc @column(overrideType: "ObjectId")
  effectPrefix: String @column
  effects: [Effect!] @column(overrideType: "ObjectId[]")
  faction: Faction! @column(overrideType: "ObjectId")
  hero: Boolean @column
  id: ID! @id @map(path: "_id")
  images: [String!]! @column
  name: String! @column
  quote: String! @column
  scorchMin: Int @column
  scorchScope: Combat @column
  special: Boolean @column
  strength: Int @column
}

type UnitPlayedFromDeck {
  deck: GameDeck!
  game: Game!
  unit: DeckUnit!
}

type UnitPlayedOnGame {
  game: Game!
  unit: DeckUnit!
}

type UnitStats {
  agile: Int!
  avenger: Int!
  berserker: Int!
  bond: Int!
  close: Int!
  decoy: Int!
  heroes: Int!
  horn: Int!
  mardroeme: Int!
  medic: Int!
  morale: Int!
  muster: Int!
  ranged: Int!
  scorch: Int!
  siege: Int!
  specials: Int!
  spy: Int!
  strengthAverage: Float!
  strengthTotal: Int!
  strengths: Int!
  units: Int!
  weather: Int!
}

type User @entity(additionalFields: [{path: "password", type: "string"}]) {
  created: DateTime! @column(overrideType: "Date")
  id: ID! @id
  name: String! @column
}